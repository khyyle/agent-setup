# This configuration is loaded only on the agent-setup socket.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -s extended-keys on
set -s extended-keys-format csi-u
set -g history-limit 50000
set -s escape-time 0
setw -g automatic-rename off
set -g allow-rename off

set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#141724,fg=#a5afd1'
set -g status-left ''
set -g status-right '#[fg=#a5afd1]#([ -n "$AGENT_SETUP_MUSIC_STATUS" ] && "$AGENT_SETUP_MUSIC_STATUS")#[fg=#878eaa]%H:%M '
set -g status-right-length 50
set -g window-status-separator ' '
# Add a clickable range to the final tab while retaining tmux's native scrolling.
set -g @tab-plus '#[norange default] #[range=user|newtab bg=#262b3e fg=#b7bfd8] + #[norange]'
setw -g window-status-format '#[bg=#262b3e,fg=#b7bfd8]  #W  #{?window_end_flag,#{E:@tab-plus},}'
setw -g window-status-current-format '#[bg=#a7bcfa,fg=#161927,bold]  #W  #{?window_end_flag,#{E:@tab-plus},}'
set -g pane-border-style 'fg=#34394f'
set -g pane-active-border-style 'fg=#8499cf'

bind c new-window -c '#{pane_current_path}'
bind + display-menu -T 'New tab' -x C -y S 'Pi chat' p 'new-window -n pi pi' 'Codex chat' c 'new-window -n codex codex' 'Shell' s 'new-window -n shell'
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},newtab}' {
    send-keys -K C-b +
} {
    switch-client -t =
}
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
